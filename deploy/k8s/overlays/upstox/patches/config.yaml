# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://upstox.example.com"
  VALID_BROKERS: "upstox"
  REDIRECT_URL: "https://upstox.example.com/upstox/callback"
  SESSION_COOKIE_NAME: "oa-upstox-session"
  CSRF_COOKIE_NAME: "oa-upstox-csrf"
