# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://angel.example.com"
  VALID_BROKERS: "angel"
  REDIRECT_URL: "https://angel.example.com/angel/callback"
  SESSION_COOKIE_NAME: "oa-angel-session"
  CSRF_COOKIE_NAME: "oa-angel-csrf"
