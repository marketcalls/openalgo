# Image tag pin. Base ships marketcalls/openalgo:latest; production instances
# should pin a tested release. Enable via the overlay's kustomization.yaml
# (patches: - path: patches/statefulset-image.yaml).
#
# Prefer the `images:` transformer in the overlay's kustomization.yaml instead
# when only the tag changes:
#   images:
#   - name: marketcalls/openalgo
#     newTag: v2.x.x
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openalgo
spec:
  template:
    spec:
      containers:
      - name: openalgo
        image: marketcalls/openalgo:CHANGE_ME_TAG
