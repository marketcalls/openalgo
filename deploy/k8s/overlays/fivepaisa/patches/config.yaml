# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://fivepaisa.example.com"
  VALID_BROKERS: "fivepaisa"
  REDIRECT_URL: "https://fivepaisa.example.com/fivepaisa/callback"
  SESSION_COOKIE_NAME: "oa-fivepaisa-session"
  CSRF_COOKIE_NAME: "oa-fivepaisa-csrf"
