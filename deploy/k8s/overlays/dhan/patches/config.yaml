# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://dhan.example.com"
  VALID_BROKERS: "dhan"
  REDIRECT_URL: "https://dhan.example.com/dhan/callback"
  SESSION_COOKIE_NAME: "oa-dhan-session"
  CSRF_COOKIE_NAME: "oa-dhan-csrf"
