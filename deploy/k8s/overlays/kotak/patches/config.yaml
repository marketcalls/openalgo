# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://kotak.example.com"
  VALID_BROKERS: "kotak"
  REDIRECT_URL: "https://kotak.example.com/kotak/callback"
  SESSION_COOKIE_NAME: "oa-kotak-session"
  CSRF_COOKIE_NAME: "oa-kotak-csrf"
