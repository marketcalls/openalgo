# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://paytm.example.com"
  VALID_BROKERS: "paytm"
  REDIRECT_URL: "https://paytm.example.com/paytm/callback"
  SESSION_COOKIE_NAME: "oa-paytm-session"
  CSRF_COOKIE_NAME: "oa-paytm-csrf"
