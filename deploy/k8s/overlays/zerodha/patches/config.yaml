# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://zerodha.example.com"
  VALID_BROKERS: "zerodha"
  REDIRECT_URL: "https://zerodha.example.com/zerodha/callback"
  SESSION_COOKIE_NAME: "oa-zerodha-session"
  CSRF_COOKIE_NAME: "oa-zerodha-csrf"
