# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://motilal.example.com"
  VALID_BROKERS: "motilal"
  REDIRECT_URL: "https://motilal.example.com/motilal/callback"
  SESSION_COOKIE_NAME: "oa-motilal-session"
  CSRF_COOKIE_NAME: "oa-motilal-csrf"
