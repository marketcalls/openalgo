# Per-instance config (pre-prefix base names — patches run before transformers).
# CORS_ALLOWED_ORIGINS and WEBSOCKET_URL are derived from HOST_SERVER by start.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openalgo-config
data:
  HOST_SERVER: "https://groww.example.com"
  VALID_BROKERS: "groww"
  REDIRECT_URL: "https://groww.example.com/groww/callback"
  SESSION_COOKIE_NAME: "oa-groww-session"
  CSRF_COOKIE_NAME: "oa-groww-csrf"
