<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1520" viewBox="0 0 1280 1520" role="img" aria-labelledby="architecture-title architecture-description">
<title id="architecture-title">OpenAlgo Charts 2.6.4 architecture</title>
<desc id="architecture-description">A host application supplies UI, market-data adapters and instrument metadata, selects charts and activates workspaces. The base engine contains shared data loading, a DataLayer and time scale, independent price scales, custom study and primitive contracts, Canvas 2D rendering, alerts, grouped timeline events, replay groups and appearance linking. The host applies loading snapshots through series APIs. Each pane has a base and an overlay canvas. Open interest is optional: aggregation retains the last reading, never a sum, and missing is not zero. Alert gestures preview without saving and commit once; events go to the host for delivery. Shared replay uses observation availability. Eight optional ESM tiers add built-in indicators, drawing tools with anchored volume analysis and synchronization, profiles, transforms, trading tools, workspace documents and storage, WebGL2 series rendering and the widget UI with a Data/Objects dock, rich symbol lookup and reusable colour controls. The base object model supports stable study ordering and movement, and lower panes collapse to a strip; study outputs can target the price pane or a named plot. The drawing controller owns named groups and per-drawing policies. The widget adds a chart grid of up to sixteen charts, a bottom bar, saved layouts, go-to-date navigation, and watchlist, news and account panels over optional quote, news and account contracts. The price pane can move below its studies on a chart that opts in, drawings can be pinned to the viewport, and the trade tier adds account state, position commands and price tick schedules. Study and profile calculations stay on the CPU; axes, text and primitives stay on Canvas 2D. Broker execution and external notifications remain host responsibilities. Nine entry points, zero runtime dependencies. Decimal Brotli sizes measured on 2.6.4: base 137.65 kB, indicators 43.02 kB, draw 58.44 kB, profile 20.83 kB, transform 6.23 kB, trade 16.88 kB, workspace 11.73 kB, webgl 6.97 kB, widget 124.94 kB, all tiers 426.67 kB.</desc>
