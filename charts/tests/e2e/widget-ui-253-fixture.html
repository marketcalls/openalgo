<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
body { margin: 0; background: #111318; color: #ddd; font: 14px system-ui; }
#host { width: 100%; height: 700px; }
#outside { margin: 12px; }
</style></head><body><div id="host"></div><input id="outside" aria-label="Outside editor">
<script type="module">
import { createWidget } from '/dist/openalgo-charts.widget.mjs';
import { generateBars } from '/dist/openalgo-charts.mjs';
import '/dist/openalgo-charts.indicators.mjs';
const bars = generateBars(1700000000, 200, 300).map((bar, index) => ({ ...bar, ...(index % 30 === 0 ? {} : { oi: 4000 + index * 3 }) }));
const hits = [
  { symbol: 'NOVA', exchange: 'NSE', name: 'Nova Industries', assetClass: 'Stock' },
  { symbol: 'NOVA', exchange: 'BSE', name: 'Nova Industries', assetClass: 'Stock' },
  { symbol: 'NOVA FUT', exchange: 'NFO', name: 'Nova futures', assetClass: 'Futures', contractGroup: { contracts: [
    { symbol: 'NOVA26SEP', exchange: 'NFO', name: 'September' },
    { symbol: 'NOVA26OCT', exchange: 'NFO', name: 'October' },
  ] } },
  { symbol: 'BTCUSD', exchange: 'DEMO', name: 'Bitcoin', assetClass: 'Crypto' },
];
const widget = createWidget(document.querySelector('#host'), {
  symbol: 'NOVA', exchange: 'NSE', interval: '5m', persist: false,
  feed: { getBars: async () => bars, subscribeBars: () => () => {} },
  symbolSearch: async () => hits,
  rail: false, navigation: { defaultVisibleBars: 130 },
});
widget.series.setData(bars);
widget.chart.setDataContext({ symbol: 'NOVA', exchange: 'NSE', interval: '5m', hasOpenInterest: true });
const first = widget.chart.addIndicator('ema', { length: 10 });
const second = widget.chart.addIndicator('ema', { length: 30 });
const rsi = widget.chart.addIndicator('rsi');
const a = widget.draw.add({ tool: 'trend-line', paneIndex: 0, points: [
  { time: bars[70].time, price: bars[70].low }, { time: bars[130].time, price: bars[130].low },
] });
const b = widget.draw.add({ tool: 'horizontal-line', paneIndex: 0, points: [{ time: bars[150].time, price: bars[150].high }] });
window.__ui253 = { widget, bars, first: first.id, second: second.id, rsi: rsi.id, drawings: [a.id, b.id] };
</script></body></html>
