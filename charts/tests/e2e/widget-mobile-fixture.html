<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" /><style>html,body{margin:0;height:100%;background:#0d0e12}#t{position:absolute;inset:0}</style></head>
<body>
  <div id="t"></div>
  <script type="module">
    // The widget tier against the static server: the same sibling-path
    // loading a page gets by serving dist/ as is, no import map. The indicator
    // tier is imported the way a host would, so the picker has rows.
    import { createWidget } from '/dist/openalgo-charts.widget.mjs';
    import '/dist/openalgo-charts.indicators.mjs';

    // Deterministic OHLCV (no network): a seeded random walk of five-minute
    // bars in NSE hours, 09:15 IST on weekdays, so a screenshot of the chrome
    // shows a chart that reads like a traded stock.
    let seed = 20260929;
    const uniform = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return (seed + 0.5) / 4294967296; };
    const normal = () => Math.sqrt(-2 * Math.log(uniform())) * Math.cos(2 * Math.PI * uniform());
    const tick = (value) => Math.round(value * 20) / 20;
    const bars = [];
    let price = 1486.4;
    let vol = 0.0016;
    for (let day = Date.UTC(2026, 7, 3) / 1000; bars.length < 300; day += 86400) {
      const weekday = new Date(day * 1000).getUTCDay();
      if (weekday === 0 || weekday === 6) continue;
      price *= 1 + normal() * 0.006;
      for (let slot = 0; slot < 75 && bars.length < 300; slot++) {
        vol = Math.min(0.004, Math.max(0.0008, vol * (1 + normal() * 0.08)));
        const open = tick(price);
        const close = tick(open * (1 + normal() * vol));
        const high = tick(Math.max(open, close) * (1 + Math.abs(normal()) * vol * 0.5));
        const low = tick(Math.min(open, close) * (1 - Math.abs(normal()) * vol * 0.5));
        const busy = slot < 6 || slot > 68 ? 2.2 : 1;
        bars.push({ time: day + 13_500 + slot * 300, open, high, low, close, volume: Math.round(busy * 42_000 * (0.6 + uniform())) });
        price = close;
      }
    }
    const feed = {
      getBars: async () => bars,
      subscribeBars: () => () => {},
    };

    const errors = [];
    window.__widgetErrors = errors;
    const widget = createWidget(document.getElementById('t'), {
      mobile: 'auto', feed, symbol: 'FIXTURE', exchange: 'NSE', interval: '5m',
      theme: 'dark', rail: { favorites: ['trend-line'] },
      persist: new URLSearchParams(location.search).has('persist'),
      onOrder: (o) => { window.__lastOrder = o; },
    });
    widget.on('data', (e) => { if (e.error) errors.push(e.error); window.__loaded = e.bars; });
    window.__widget = widget;
    window.__ready = true;
  </script>
</body>
</html>
