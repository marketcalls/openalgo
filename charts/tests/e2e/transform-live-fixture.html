<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>In-chart transform fixture</title>
  <style>html,body{margin:0;height:100%}#chart{position:absolute;inset:0}</style>
</head>
<body>
  <div id="chart"></div>
  <script type="module">
    import * as lib from '/dist/openalgo-charts.mjs';
    import '/dist/openalgo-charts.transform.mjs';
    import '/dist/openalgo-charts.indicators.mjs';
    const query = new URLSearchParams(location.search);
    const type = query.get('type') || 'renko';
    const dark = query.get('theme') !== 'light';
    const theme = dark ? lib.darkTheme : lib.lightTheme;
    document.body.style.background = theme.background;

    // A session of five-minute bars that trades like a stock: a seeded random
    // walk with wicks, so every transform has real movement to form from.
    let seed = 20260930;
    const random = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const gauss = () => Math.sqrt(-2 * Math.log(random() || 1e-9)) * Math.cos(2 * Math.PI * random());
    const bars = [];
    let close = 1486.35;
    for (let i = 0, t = Date.UTC(2026, 8, 1, 3, 45) / 1000; i < 360; i++, t += 300) {
      const open = close;
      close = Math.round(open * (1 + gauss() * 0.0019) * 20) / 20;
      const wick = open * 0.0011;
      bars.push({
        time: t, open, close,
        high: Math.round((Math.max(open, close) + random() * wick) * 20) / 20,
        low: Math.round((Math.min(open, close) - random() * wick) * 20) / 20,
        volume: Math.round(52000 * (0.5 + random())),
      });
    }

    const chart = lib.createChart(document.getElementById('chart'), {
      theme, animZoom: false, timeNavigator: false, branding: false,
    });
    const options = type === 'renko' ? { boxSize: 2 } : undefined;
    const spec = options ? { type, options } : { type };
    const series = chart.addSeries(lib.getSeriesTransform(type).renderer, { transform: spec });
    series.setData(bars);
    chart.setDataContext({ symbol: 'SIM', exchange: 'DEMO', interval: '5m' });
    if (query.get('study') !== 'none') chart.addIndicator('sma', { length: 9 }, query.get('study') === 'underlying' ? { barSource: 'underlying' } : {});
    chart.fitContent();

    // The forming bar the ticks below revise, as a live feed would.
    let forming = null;
    window.__probe = {
      chart, series, lib,
      box: () => 2,
      elements: () => chart.primaryBars().map(bar => ({ time: bar.time, open: bar.open, close: bar.close })),
      /** Open a new bar five minutes after the last one, at the last close. */
      open: () => {
        const last = series.getData().at(-1);
        forming = { time: last.time + 300, open: last.close, high: last.close, low: last.close, close: last.close, volume: 0 };
        series.update({ ...forming });
      },
      /** A tick on the forming bar. */
      tick: (price) => {
        forming = { ...forming, close: price, high: Math.max(forming.high, price), low: Math.min(forming.low, price), volume: forming.volume + 100 };
        series.update({ ...forming });
      },
      lastSource: () => series.getData().at(-1),
    };
    window.__frame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    await window.__frame();
    window.__ready = true;
  </script>
</body>
</html>
