<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Chart grid fixture</title>
<style>html,body{margin:0;height:100%;background:#0d0e12}#grid{position:absolute;inset:0}</style></head>
<body><div id="grid"></div>
<script type="module">
import { VERSION } from '/dist/openalgo-charts.mjs';
import '/dist/openalgo-charts.indicators.mjs';
import { createChartGrid } from '/dist/openalgo-charts.widget.mjs';
import { WorkspaceRepository, createIndexedDbWorkspaceStorage } from '/dist/openalgo-charts.workspace.mjs';
const T = 1700000040;
const history = [];
const params = new URLSearchParams(location.search);
/**
 * A seeded random walk, like a real stock's minute bars: each instrument (its
 * base price) has its own seed, and a longer walk starts with the shorter
 * one, so bar n is the same whether it arrives in a history or on its own.
 */
const bars = (count = 120, base = 100) => {
  let seed = Math.round(base * 7919) >>> 0;
  const rand = () => {
    seed = (seed + 0x6d2b79f5) >>> 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const out = [];
  let close = base;
  for (let n = 0; n < count; n++) {
    const open = close;
    close = Math.max(1, open * (1 + (rand() - 0.49) * 0.012));
    const high = Math.max(open, close) * (1 + rand() * 0.004);
    const low = Math.min(open, close) * (1 - rand() * 0.004);
    out.push({ time: T + n * 60, open, high, low, close, volume: Math.round(800 + rand() * 1600) });
  }
  return out;
};
const feed = { getBars: request => new Promise((resolve, reject) => history.push({ request, resolve, reject })) };
const grid = createChartGrid(document.getElementById('grid'), {
  feed, symbol: 'AAA', exchange: 'NSE', interval: '1m', now: () => (T + 200 * 60) * 1000, lookbackBars: 120,
  preset: params.get('preset') || '2x2', rail: params.get('rail') === '1', statusline: params.get('statusline') === '1',
  toolbar: params.get('toolbar') === '1', theme: params.get('theme') === 'light' ? 'light' : 'dark',
  links: { crosshair: true, viewport: false },
  // ?bottombar=1 one bar under the grid; ?workspaces=1 saved desks in IndexedDB;
  // ?persist=<name> the desk kept between visits, in IndexedDB unless ?storage=local.
  bottombar: params.get('bottombar') === '1',
  workspaces: params.get('workspaces') === '1' ? new WorkspaceRepository(createIndexedDbWorkspaceStorage(indexedDB, 'grid-fixture'), 'desk') : undefined,
  persist: params.get('persist') ?? undefined,
  storage: params.get('storage') === 'local' ? localStorage : undefined,
});
window.fixture = {
  version: VERSION, grid, history, bars,
  // Answer every open request, each symbol at its own price level.
  readyAll: () => {
    for (const entry of history.splice(0)) entry.resolve(bars(120, 100 + entry.request.symbol.charCodeAt(0)));
  },
  ranges: () => grid.cells().map(cell => cell.widget.chart.getVisibleLogicalRange()),
  counts: () => grid.cells().map(cell => cell.widget.series.getData().length),
  aborted: () => history.filter(entry => entry.request.signal?.aborted).length,
};
</script></body></html>
