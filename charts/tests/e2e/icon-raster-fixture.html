<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>
html, body { margin: 0; height: 100%; background: #131722; }
#host { position: absolute; inset: 0; }
#sheet { display: none; }
</style></head>
<body><div id="host"></div><div id="sheet"></div><script type="module">
// Both glyph tiers as the built draw tier hands them to a host, two ways: the
// markup builders, accents included, and the bare path data in the tier's
// attribute bag, which is all a host that wraps the registry itself draws.
// Each at the size its tier is drawn for. The layout tiles a picker derives come
// alongside. A widget beside them shows the same glyphs in place, in the
// rail, a flyout, a menu and the settings dialogs.
import {
  iconSvg, chromeIconSvg, drawingToolIconIds, chromeIconIds, layoutIconPath,
  DRAWING_TOOL_ICONS, ICON_ATTRS, CHROME_ICONS, CHROME_ICON_ATTRS, CHROME_ICON_FILLED, ICON_SIZE, CHROME_ICON_SIZE,
} from '/dist/openalgo-charts.draw.mjs';
import { createWidget, mountIndicatorSettings } from '/dist/openalgo-charts.widget.mjs';
import '/dist/openalgo-charts.indicators.mjs';

const bare = (d, a, fill) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${a.viewBox}" width="${a.viewBox.split(' ')[2]}"`
  + ` height="${a.viewBox.split(' ')[2]}" fill="${fill}" stroke="${a.stroke}" stroke-width="${a.strokeWidth}"`
  + ` stroke-linecap="${a.strokeLinecap}" stroke-linejoin="${a.strokeLinejoin}"><path d="${d}"/></svg>`;
// The layouts a picker offers: even grids up to four a side, and the uneven
// ones as spans.
const LAYOUTS = [
  ['1x1', 1, 1], ['1x2', 1, 2], ['2x1', 2, 1], ['1x3', 1, 3], ['3x1', 3, 1], ['2x2', 2, 2], ['2x3', 2, 3],
  ['3x2', 3, 2], ['2x4', 2, 4], ['3x3', 3, 3], ['3x4', 3, 4], ['4x4', 4, 4],
  ['1+2', 2, 2, [{ row: 0, column: 0, rowSpan: 2 }, { row: 0, column: 1 }, { row: 1, column: 1 }]],
  ['2+1', 2, 2, [{ row: 0, column: 0 }, { row: 1, column: 0 }, { row: 0, column: 1, rowSpan: 2 }]],
  ['1+3', 3, 2, [{ row: 0, column: 0, rowSpan: 3 }, { row: 0, column: 1 }, { row: 1, column: 1 }, { row: 2, column: 1 }]],
  ['1/2', 2, 2, [{ row: 0, column: 0, columnSpan: 2 }, { row: 1, column: 0 }, { row: 1, column: 1 }]],
  ['2/1', 2, 2, [{ row: 0, column: 0 }, { row: 0, column: 1 }, { row: 1, column: 0, columnSpan: 2 }]],
];
const icons = {
  tools: drawingToolIconIds().map((id) => ({ id, svg: iconSvg(id), px: ICON_SIZE })),
  chrome: chromeIconIds().map((id) => ({ id, svg: chromeIconSvg(id), px: CHROME_ICON_SIZE })),
  toolsPath: drawingToolIconIds().map((id) => ({ id, svg: bare(DRAWING_TOOL_ICONS[id], ICON_ATTRS, 'none'), px: ICON_SIZE })),
  chromePath: chromeIconIds().map((id) => ({
    id, svg: bare(CHROME_ICONS[id], CHROME_ICON_ATTRS, CHROME_ICON_FILLED.has(id) ? 'currentColor' : 'none'), px: CHROME_ICON_SIZE,
  })),
  layouts: LAYOUTS.map(([id, rows, columns, slots]) => ({ id, svg: bare(layoutIconPath(rows, columns, slots), CHROME_ICON_ATTRS, 'none'), px: CHROME_ICON_SIZE })),
};

// A seeded random walk, so the chart behind the glyphs looks like a traded
// instrument and every run draws the same one.
let seed = 20260929;
const rand = () => {
  seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const tick = (x) => Math.round(x * 20) / 20;
const bars = [];
let p = 1520;
for (let i = 0; i < 240; i++) {
  const o = p;
  p = tick(o * (1 + (rand() - 0.5) * 0.008));
  const high = tick(Math.max(o, p) * (1 + rand() * 0.002));
  const low = tick(Math.min(o, p) * (1 - rand() * 0.002));
  bars.push({ time: 1_700_000_000 + i * 300, open: o, high, low, close: p, volume: Math.round(800 + rand() * 4000) });
}
const theme = new URLSearchParams(location.search).get('theme') === 'light' ? 'light' : 'dark';
if (theme === 'light') document.body.style.background = '#ffffff';
const widget = createWidget(document.getElementById('host'), {
  feed: { getBars: async () => bars, subscribeBars: () => () => {} },
  symbol: 'ICONS', exchange: 'NSE', interval: '5m', theme,
  rail: { favorites: ['trend-line', 'ray', 'long-position'] },
});
let lineId = '';
widget.on('data', () => {
  if (lineId !== '') return;
  // A trend line from a swing low to a swing high in the walk, so the drawing
  // sits on the data rather than on made-up prices.
  const span = bars.slice(140, 210);
  const lo = span.reduce((a, b) => (b.low < a.low ? b : a));
  const hi = span.filter((b) => b.time > lo.time).reduce((a, b) => (b.high > a.high ? b : a), lo);
  lineId = widget.draw.add({ tool: 'trend-line', paneIndex: 0,
    points: [{ time: lo.time, price: lo.low }, { time: hi.time === lo.time ? bars[209].time : hi.time, price: hi.high }],
    style: { color: '#ff00ff', lineWidth: 3 },
  }).id;
  window.__iconFixture.lineId = lineId;
});

/**
 * Every chrome glyph and layout tile in a labelled grid over the page, at
 * 16px, in the page's theme, so a run leaves a picture of the set in each
 * engine to look at. Returns the number of cells drawn.
 */
function showSheet() {
  const sheet = document.getElementById('sheet');
  const fg = theme === 'light' ? '#131722' : '#d1d4dc';
  sheet.style.cssText = `display:grid;grid-template-columns:repeat(12,88px);gap:6px 0;padding:10px;position:absolute;inset:0;`
    + `z-index:10;overflow:auto;background:${theme === 'light' ? '#ffffff' : '#131722'};color:${fg};font:9px sans-serif`;
  const cells = [...icons.chrome, ...icons.layouts.map((g) => ({ ...g, id: `layout ${g.id}` }))];
  sheet.innerHTML = cells.map((g) => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px">`
    + `<span style="display:flex;width:16px;height:16px">${g.svg}</span><span style="opacity:.7">${g.id}</span></div>`).join('');
  return cells.length;
}
window.__iconFixture = { icons, widget, lineId, mountIndicatorSettings, showSheet };
</script></body></html>
