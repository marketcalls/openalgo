<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" /><style>html,body{margin:0;height:100%;background:#0d0e12}#t{position:absolute;inset:0}</style></head>
<body>
  <div id="t"></div>
  <script type="module">
    // A widget with saved layouts and indicator templates over the browser's
    // own IndexedDB: two pages of one browser context share the catalog, as
    // two tabs of one account do. The indicator tier is imported the way a
    // host would, so the picker has rows.
    import { createWidget } from '/dist/openalgo-charts.widget.mjs';
    import '/dist/openalgo-charts.indicators.mjs';
    import { WorkspaceRepository, createIndexedDbWorkspaceStorage } from '/dist/openalgo-charts.workspace.mjs';

    const params = new URLSearchParams(location.search);
    document.body.style.background = params.get('theme') === 'light' ? '#f5f6f8' : '#0d0e12';

    // Deterministic OHLCV (no network): a seeded random walk of five-minute
    // bars in NSE hours, one walk per symbol, so a layout on another symbol
    // shows another stock.
    function bars(symbol, interval) {
      let seed = 20260929;
      for (const ch of symbol + interval) seed = (Math.imul(seed, 31) + ch.charCodeAt(0)) >>> 0;
      const uniform = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return (seed + 0.5) / 4294967296; };
      const normal = () => Math.sqrt(-2 * Math.log(uniform())) * Math.cos(2 * Math.PI * uniform());
      const tick = (value) => Math.round(value * 20) / 20;
      const step = { '1m': 60, '5m': 300, '15m': 900, '1h': 3600 }[interval] ?? 86400;
      const perDay = Math.max(1, Math.floor(22_500 / step));
      const out = [];
      let price = { INFY: 1486.4, TCS: 3921.8, SBIN: 812.35 }[symbol] ?? 1000;
      let vol = 0.0016 * Math.sqrt(step / 300);
      for (let day = Date.UTC(2026, 6, 1) / 1000; out.length < 320; day += 86400) {
        const weekday = new Date(day * 1000).getUTCDay();
        if (weekday === 0 || weekday === 6) continue;
        price *= 1 + normal() * 0.006;
        for (let slot = 0; slot < perDay && out.length < 320; slot++) {
          vol = Math.min(0.02, Math.max(0.0006, vol * (1 + normal() * 0.08)));
          const open = tick(price);
          const close = tick(open * (1 + normal() * vol));
          const high = tick(Math.max(open, close) * (1 + Math.abs(normal()) * vol * 0.5));
          const low = tick(Math.min(open, close) * (1 - Math.abs(normal()) * vol * 0.5));
          out.push({ time: day + 13_500 + slot * step, open, high, low, close, volume: Math.round(42_000 * (0.6 + uniform())) });
          price = close;
        }
      }
      return out;
    }
    const feed = {
      getBars: async (request) => bars(request.symbol, request.interval),
      subscribeBars: () => () => {},
    };

    const errors = [];
    window.__widgetErrors = errors;
    const storage = createIndexedDbWorkspaceStorage(indexedDB, 'widget-layouts-e2e');
    const repo = new WorkspaceRepository(storage, 'desk');
    const widget = createWidget(document.getElementById('t'), {
      feed, symbol: 'INFY', exchange: 'NSE', interval: '5m',
      theme: params.get('theme') === 'light' ? 'light' : 'dark',
      mobile: params.has('phone') ? 'always' : 'auto',
      rail: { favorites: ['trend-line'] }, workspaces: repo,
    });
    widget.on('data', (e) => { if (e.error) errors.push(e.error); window.__loaded = e.bars; });
    window.__widget = widget;
    window.__repo = repo;
    window.__storage = storage;
    window.__ready = true;
  </script>
</body>
</html>
